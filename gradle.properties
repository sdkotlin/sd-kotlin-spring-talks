org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true

# The Spring Boot Gradle Plugin's `BootJar` task reads `group` and `version`
# off every project in the build, which isolated projects forbids:
# "Project ':subprojects:app' cannot access 'Project.group' functionality on
# subprojects of project ':'". Blocked upstream on
# https://github.com/spring-projects/spring-boot/issues/43755.
#org.gradle.unsafe.isolated-projects=true

# Explicitly enable filesystem watching so Gradle doesn't go through its
# default of trying to evaluate whether it can be enabled automatically, which
# can be slow on Windows machines with mapped network drives:
# https://github.com/gradle/gradle/issues/17955.
org.gradle.vfs.watch=true

# Workaround for KGP eager configuration realization:
# https://youtrack.jetbrains.com/issue/KT-76797
kotlin.stdlib.jdk.variants.version.alignment = false

dependency.analysis.print.build.health=true
